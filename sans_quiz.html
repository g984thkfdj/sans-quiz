<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SANS Quiz">
<title>SANS Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.15);--text:#f0f0f0;--text2:#888;--text3:#444;
  --accent:#e8ff5a;--accent-dim:rgba(232,255,90,0.1);--accent-text:#0f0f0f;
  --green:#4ade80;--green-dim:rgba(74,222,128,0.12);
  --red:#f87171;--red-dim:rgba(248,113,113,0.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,0.1);
  --blue:#60a5fa;--blue-dim:rgba(96,165,250,0.12);
  --r:12px;--rsm:8px;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);color:var(--text);overscroll-behavior:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;background:rgba(15,15,15,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex}
.nav-btn{flex:1;padding:6px 4px;background:none;border:none;color:var(--text3);font-family:var(--font);font-size:10px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.2s}
.nav-btn svg{width:22px;height:22px}
.nav-btn.active{color:var(--accent)}
.screen{display:none;padding:16px}
.screen.active{display:block}
.sec{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.ml{font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500}
.mv{font-size:26px;font-weight:600;font-family:var(--mono);line-height:1}
.mv.ac{color:var(--accent)}.mv.gr{color:var(--green)}.mv.am{color:var(--amber)}.mv.bl{color:var(--blue)}
.pb{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:7px}
.pf{height:100%;border-radius:2px;transition:width 0.4s}
.pf.gr{background:var(--green)}.pf.am{background:var(--amber)}.pf.rd{background:var(--red)}.pf.ac{background:var(--accent)}.pf.bl{background:var(--blue)}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.bac{background:var(--accent-dim);color:var(--accent)}.bgr{background:var(--green-dim);color:var(--green)}
.brd{background:var(--red-dim);color:var(--red)}.bam{background:var(--amber-dim);color:var(--amber)}
.bbl{background:var(--blue-dim);color:var(--blue)}.bgray{background:var(--surface2);color:var(--text2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:var(--rsm);font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s;border:1px solid var(--border2);background:var(--surface2);color:var(--text)}
.btn:active{transform:scale(0.97)}
.btn.pr{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.btn.pr:hover{opacity:0.9}
.btn.fu{width:100%}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.gh{background:transparent;border-color:transparent;color:var(--text2)}
.btn.dn{color:var(--red);border-color:rgba(248,113,113,0.25);background:transparent}
.rbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.rb{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:var(--rsm);border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all 0.15s;font-family:var(--font)}
.rb:active{transform:scale(0.96)}
.rb-l{font-size:13px;font-weight:600;margin-bottom:2px}
.rb-i{font-size:10px;font-family:var(--mono);color:var(--text2)}
.rb.ag{border-color:rgba(248,113,113,0.35);color:var(--red)}.rb.ag:hover{background:var(--red-dim)}
.rb.hd{border-color:rgba(251,191,36,0.35);color:var(--amber)}.rb.hd:hover{background:var(--amber-dim)}
.rb.gd{border-color:rgba(74,222,128,0.35);color:var(--green)}.rb.gd:hover{background:var(--green-dim)}
.rb.ez{border-color:rgba(96,165,250,0.35);color:var(--blue)}.rb.ez:hover{background:var(--blue-dim)}
.fg{margin-bottom:12px}
.fl{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block}
.fi{width:100%;padding:10px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rsm);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color 0.2s;-webkit-appearance:none}
.fi:focus{border-color:var(--accent)}
.fi::placeholder{color:var(--text3)}
textarea.fi{resize:vertical;min-height:68px;line-height:1.6}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cgrp{display:flex;gap:6px;flex-wrap:wrap;padding:10px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rsm)}
.cl{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:500;cursor:pointer;padding:4px 8px;border-radius:6px;color:var(--text2);transition:all 0.15s;user-select:none}
.cl input{display:none}
.cl.on{background:var(--accent-dim);color:var(--accent)}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:10px}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qt{font-size:16px;line-height:1.75}
.ch{width:100%;text-align:left;padding:13px 15px;margin-bottom:7px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rsm);color:var(--text);font-family:var(--font);font-size:15px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:all 0.15s;line-height:1.5}
.ch:hover:not(:disabled){border-color:var(--border2);background:var(--surface2)}
.ch:disabled{cursor:default}
.chl{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text2);min-width:16px;margin-top:2px}
.ch.cor{border-color:var(--green);background:var(--green-dim);color:var(--green)}.ch.cor .chl{color:var(--green)}
.ch.wrg{border-color:var(--red);background:var(--red-dim);color:var(--red)}.ch.wrg .chl{color:var(--red)}
.fb{padding:13px 15px;border-radius:var(--rsm);font-size:14px;line-height:1.6;margin-bottom:10px}
.fb.cor{background:var(--green-dim);color:var(--green);border:1px solid rgba(74,222,128,0.2)}
.fb.wrg{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,0.2)}
.fb strong{font-weight:600}
.memo{margin-top:8px;color:var(--text);font-size:13px;opacity:0.85;line-height:1.6}
.rc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:32px 24px;text-align:center;margin-bottom:12px}
.rpct{font-size:64px;font-weight:600;font-family:var(--mono);color:var(--accent);line-height:1;margin:8px 0}
.rmsg{font-size:14px;color:var(--text2)}
.qi{padding:13px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.qi:last-child{border-bottom:none}
.qim{flex:1;min-width:0}
.qimt{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.qitx{font-size:14px;line-height:1.5}
.di{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.dl{min-width:76px;color:var(--text2)}
.dbw{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.db{height:100%;border-radius:4px;transition:width 0.5s}
.dc{min-width:28px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--text2)}
.hm{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;margin:12px 0}
.hc{aspect-ratio:1;border-radius:2px;background:var(--surface2)}
.hc.l1{background:rgba(232,255,90,0.2)}.hc.l2{background:rgba(232,255,90,0.45)}.hc.l3{background:rgba(232,255,90,0.7)}.hc.l4{background:var(--accent)}
.srow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);margin-bottom:14px}
.sd{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.sd.sy{background:var(--green)}.sd.sg{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.toast{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface2);border:1px solid var(--border2);border-radius:100px;padding:9px 18px;font-size:13px;font-weight:500;color:var(--text);opacity:0;transition:all 0.3s;white-space:nowrap;z-index:999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(74,222,128,0.4);color:var(--green)}
.toast.error{border-color:rgba(248,113,113,0.4);color:var(--red)}
.empty{text-align:center;padding:36px 20px;color:var(--text3);font-size:14px}
.due-ban{background:var(--accent-dim);border:1px solid rgba(232,255,90,0.2);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
@media(prefers-color-scheme:light){
  :root{--bg:#f5f5f0;--surface:#fff;--surface2:#f0f0ea;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);--text:#111;--text2:#666;--text3:#aaa;--accent:#2a6e00;--accent-dim:rgba(42,110,0,0.08);--accent-text:#fff;--green:#16a34a;--green-dim:rgba(22,163,74,0.08);--red:#dc2626;--red-dim:rgba(220,38,38,0.08);--amber:#d97706;--amber-dim:rgba(217,119,6,0.08);--blue:#2563eb;--blue-dim:rgba(37,99,235,0.08)}
}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<div id="s-home" class="screen active">
  <div class="srow"><div class="sd" id="sdot"></div><span id="stext">読み込み中...</span></div>
  <div class="mg">
    <div class="metric"><div class="ml">登録問題数</div><div class="mv ac" id="h-tot">0</div></div>
    <div class="metric"><div class="ml">今日の復習</div><div class="mv gr" id="h-due">0</div><div style="font-size:11px;color:var(--text3);margin-top:2px">件期限切れ</div></div>
    <div class="metric"><div class="ml">連続学習</div><div class="mv am" id="h-str">0</div><div style="font-size:11px;color:var(--text3);margin-top:2px">日</div></div>
    <div class="metric"><div class="ml">全体正答率</div><div class="mv bl" id="h-rate">—</div></div>
  </div>
  <div class="card"><div class="sec">カテゴリー別</div><div id="cat-st"></div></div>
</div>

<!-- QUIZ -->
<div id="s-quiz" class="screen">
  <div id="q-setup">
    <div class="due-ban" id="due-ban" style="display:none">
      <div><div class="mv ac" id="due-num" style="font-size:28px">0</div><div style="font-size:12px;color:var(--text2);margin-top:2px">件 今日の復習あり</div></div>
      <button class="btn pr sm" onclick="startReview()">今すぐ復習</button>
    </div>
    <div class="card">
      <div class="fg"><label class="fl">カテゴリー</label><select class="fi" id="qz-cat"><option value="all">すべて</option></select></div>
      <div class="fg"><label class="fl">出題モード</label>
        <select class="fi" id="qz-mode">
          <option value="due">復習期限の問題のみ</option>
          <option value="all">全問（ランダム）</option>
          <option value="weak">苦手順</option>
          <option value="new">新規のみ</option>
        </select>
      </div>
      <button class="btn pr fu" onclick="startQuiz()">スタート</button>
    </div>
  </div>

  <div id="q-main" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:12px;font-family:var(--mono);color:var(--text2)" id="q-prog"></span>
      <button class="btn gh sm" onclick="endQuiz()">終了</button>
    </div>
    <div class="pb" style="margin-bottom:12px"><div class="pf ac" id="q-bar" style="width:0%"></div></div>
    <div class="qcard">
      <div class="qmeta">
        <span class="badge bac" id="q-cb"></span>
        <span style="font-size:12px;color:var(--text3);font-family:var(--mono)" id="q-yr"></span>
        <span class="badge bgray" id="q-ivb" style="display:none"></span>
      </div>
      <div class="qt" id="q-tx"></div>
    </div>
    <div id="q-ch"></div>
    <div id="q-fb" style="display:none"></div>
    <div class="rbtns" id="rbtns" style="display:none">
      <button class="rb ag" onclick="rate(0)"><span class="rb-l">もう一度</span><span class="rb-i" id="ri0"></span></button>
      <button class="rb hd" onclick="rate(1)"><span class="rb-l">難しい</span><span class="rb-i" id="ri1"></span></button>
      <button class="rb gd" onclick="rate(2)"><span class="rb-l">普通</span><span class="rb-i" id="ri2"></span></button>
      <button class="rb ez" onclick="rate(3)"><span class="rb-l">簡単</span><span class="rb-i" id="ri3"></span></button>
    </div>
  </div>

  <div id="q-res" style="display:none">
    <div class="rc">
      <div class="rmsg" id="r-em"></div>
      <div class="rpct" id="r-pct"></div>
      <div class="rmsg" id="r-msg"></div>
      <div class="rmsg" id="r-dt" style="margin-top:4px"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn fu" onclick="showSetup()">もう一度</button>
      <button class="btn pr fu" onclick="switchTab('home')">ホームへ</button>
    </div>
  </div>
</div>

<!-- ADD -->
<div id="s-add" class="screen">
  <div class="sec">問題を追加</div>
  <div class="card" style="padding:20px">
    <div class="fr2" style="margin-bottom:12px">
      <div class="fg" style="margin:0"><label class="fl">カテゴリー *</label><input class="fi" type="text" id="a-cat" placeholder="例：脳血管" list="catdl"><datalist id="catdl"></datalist></div>
      <div class="fg" style="margin:0"><label class="fl">年度</label><input class="fi" type="text" id="a-yr" placeholder="2021"></div>
    </div>
    <div class="fg"><label class="fl">問題文 *</label><textarea class="fi" id="a-q" placeholder="問題文..."></textarea></div>
    <div class="fg"><label class="fl">選択肢 a *</label><input class="fi" type="text" id="a-a"></div>
    <div class="fg"><label class="fl">選択肢 b</label><input class="fi" type="text" id="a-b"></div>
    <div class="fg"><label class="fl">選択肢 c</label><input class="fi" type="text" id="a-c"></div>
    <div class="fg"><label class="fl">選択肢 d</label><input class="fi" type="text" id="a-d"></div>
    <div class="fg"><label class="fl">選択肢 e</label><input class="fi" type="text" id="a-e"></div>
    <div class="fg"><label class="fl">正解 *（複数可）</label>
      <div class="cgrp" id="achk">
        <label class="cl"><input type="checkbox" value="a"> a</label>
        <label class="cl"><input type="checkbox" value="b"> b</label>
        <label class="cl"><input type="checkbox" value="c"> c</label>
        <label class="cl"><input type="checkbox" value="d"> d</label>
        <label class="cl"><input type="checkbox" value="e"> e</label>
      </div>
    </div>
    <div class="fg"><label class="fl">解説（任意）</label><textarea class="fi" id="a-mem" placeholder="解説・ポイント..."></textarea></div>
    <button class="btn pr fu" onclick="addQ()">登録する</button>
  </div>
</div>

<!-- MANAGE -->
<div id="s-manage" class="screen">
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <select class="fi" id="f-cat" style="flex:1" onchange="renderManage()"><option value="all">すべて</option></select>
    <button class="btn dn sm" onclick="resetAll()">リセット</button>
  </div>
  <div class="card" style="padding:8px 16px"><div id="qlist"></div></div>
</div>

<!-- STATS -->
<div id="s-stats" class="screen">
  <div class="sec">学習統計</div>
  <div class="mg">
    <div class="metric"><div class="ml">総解答数</div><div class="mv ac" id="st-ta">0</div></div>
    <div class="metric"><div class="ml">連続学習日数</div><div class="mv am" id="st-str">0<span style="font-size:13px"> 日</span></div></div>
    <div class="metric"><div class="ml">今日の解答</div><div class="mv gr" id="st-td">0</div></div>
    <div class="metric"><div class="ml">習熟済み(21日+)</div><div class="mv bl" id="st-mt">0</div></div>
  </div>
  <div class="card">
    <div class="sec">過去26週の学習ヒートマップ</div>
    <div class="hm" id="heatmap"></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3)"><span>26週前</span><span>今日</span></div>
  </div>
  <div class="card"><div class="sec">問題の状態分布</div><div id="dist"></div></div>
  <div class="card"><div class="sec">カテゴリー別習熟度</div><div id="cat-mas"></div></div>
</div>

</div>

<nav class="nav">
  <button class="nav-btn active" onclick="switchTab('home')" id="tab-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    ホーム
  </button>
  <button class="nav-btn" onclick="switchTab('quiz')" id="tab-quiz">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
    問題を解く
  </button>
  <button class="nav-btn" onclick="switchTab('add')" id="tab-add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    追加
  </button>
  <button class="nav-btn" onclick="switchTab('manage')" id="tab-manage">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    一覧
  </button>
  <button class="nav-btn" onclick="switchTab('stats')" id="tab-stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    統計
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const DAYS = 86400000;
const today = () => Math.floor(Date.now() / DAYS);

function sm2(card, rating) {
  let {interval=0, ease=2.5, reps=0} = card.sr || {};
  if (rating === 0) { interval = 1; reps = 0; }
  else if (rating === 1) { interval = Math.max(1, Math.round(interval * 1.2)); ease = Math.max(1.3, ease - 0.15); reps++; }
  else if (rating === 2) { interval = reps===0?1:reps===1?3:Math.round(interval*ease); reps++; }
  else { interval = reps===0?3:reps===1?5:Math.round(interval*ease*1.3); ease = Math.min(3.5, ease+0.15); reps++; }
  interval = Math.min(interval, 365);
  return { interval, ease: +ease.toFixed(2), reps, due: today()+interval, lastRated: today() };
}

function itText(card, r) {
  const tmp = {}; tmp.sr = card.sr||{};
  const d = sm2(tmp, r).interval;
  return d<=1?'明日':d<7?d+'日後':d<30?Math.round(d/7)+'週後':d<365?Math.round(d/30)+'ヶ月後':Math.round(d/365)+'年後';
}

function isDue(q) { return (q.sr?.due ?? 0) <= today(); }

const SK = 'sans_v2', AK = 'sans_act_v2';
let questions = [], activity = {};

async function sg(k){ try{const r=await window.storage.get(k);return r?r.value:null}catch{return null} }
async function ss(k,v){ try{await window.storage.set(k,v);return true}catch{return false} }

async function load() {
  setSS('sg','同期中...');
  const [qr,ar] = await Promise.all([sg(SK),sg(AK)]);
  if(qr){try{questions=JSON.parse(qr)}catch{questions=[]}}
  if(ar){try{activity=JSON.parse(ar)}catch{activity={}}}
  setSS('sy', questions.length+'問 同期済み');
  updateAll();
}

async function save() {
  setSS('sg','保存中...');
  const ok = await ss(SK, JSON.stringify(questions));
  await ss(AK, JSON.stringify(activity));
  setSS(ok?'sy':'', ok?questions.length+'問 保存済み':'保存失敗');
}

function setSS(st, tx) {
  const d=document.getElementById('sdot'), t=document.getElementById('stext');
  if(d) d.className='sd'+(st==='sy'?' sy':st==='sg'?' sg':'');
  if(t) t.textContent=tx;
}

function cats() { return [...new Set(questions.map(q=>q.cat).filter(Boolean))].sort(); }
function dueCount(cat='all') { return (cat==='all'?questions:questions.filter(q=>q.cat===cat)).filter(isDue).length; }
function matureCount() { return questions.filter(q=>(q.sr?.interval||0)>=21).length; }
function todayCount() { return activity[today()]||0; }
function streak() {
  let s=0, d=today();
  while(true){ if(activity[d]){s++;d--}else if(activity[d-1]){d--}else break; }
  return s;
}

function updateAll() { updateHome(); updateDropdowns(); renderManage(); updateDueBanner(); }

function updateHome() {
  const att=questions.reduce((s,q)=>s+(q.attempts||0),0);
  const cor=questions.reduce((s,q)=>s+(q.correct||0),0);
  document.getElementById('h-tot').textContent=questions.length;
  document.getElementById('h-due').textContent=dueCount();
  document.getElementById('h-str').textContent=streak();
  document.getElementById('h-rate').textContent=att>0?Math.round(cor/att*100)+'%':'—';
  const el=document.getElementById('cat-st');
  const cs=cats();
  if(!cs.length){el.innerHTML='<div class="empty">まだ問題がありません</div>';return;}
  el.innerHTML=cs.map(c=>{
    const qs=questions.filter(q=>q.cat===c);
    const a=qs.reduce((s,q)=>s+(q.attempts||0),0);
    const r=qs.reduce((s,q)=>s+(q.correct||0),0);
    const pct=a>0?Math.round(r/a*100):null;
    const due=qs.filter(isDue).length;
    const bc=pct===null?'':pct>=70?'gr':pct>=50?'am':'rd';
    return `<div style="padding:11px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${pct!==null?'6px':'0'}">
        <span style="font-size:14px;font-weight:500">${c}</span>
        <div style="display:flex;gap:6px;align-items:center">
          ${due>0?`<span class="badge bac" style="font-size:10px">${due}件期限</span>`:''}
          <span style="font-size:13px;font-family:var(--mono);color:var(--text2)">${qs.length}問 ${pct!==null?pct+'%':'未挑戦'}</span>
        </div>
      </div>
      ${pct!==null?`<div class="pb"><div class="pf ${bc}" style="width:${pct}%"></div></div>`:''}</div>`;
  }).join('');
}

function updateDropdowns() {
  const cs=cats(), opts=cs.map(c=>`<option value="${c}">${c}</option>`).join(''), dl=cs.map(c=>`<option value="${c}">`).join('');
  ['qz-cat','f-cat'].forEach(id=>{const e=document.getElementById(id);if(e)e.innerHTML='<option value="all">すべて</option>'+opts;});
  document.getElementById('catdl').innerHTML=dl;
}

function updateDueBanner() {
  const due=dueCount(), ban=document.getElementById('due-ban'), num=document.getElementById('due-num');
  if(!ban)return;
  ban.style.display=due>0?'flex':'none';
  if(num)num.textContent=due;
}

function updateStats() {
  document.getElementById('st-ta').textContent=questions.reduce((s,q)=>s+(q.attempts||0),0);
  document.getElementById('st-str').innerHTML=streak()+'<span style="font-size:13px"> 日</span>';
  document.getElementById('st-td').textContent=todayCount();
  document.getElementById('st-mt').textContent=matureCount();
  const hm=document.getElementById('heatmap');
  const days=26*7, maxA=Math.max(1,...Object.values(activity).filter(Number));
  let cells='';
  for(let i=days-1;i>=0;i--){
    const d=today()-i, cnt=activity[d]||0, lv=cnt===0?0:cnt<3?1:cnt<6?2:cnt<10?3:4;
    cells+=`<div class="hc l${lv}" title="${cnt}問"></div>`;
  }
  hm.innerHTML=cells;
  const newC=questions.filter(q=>!q.sr?.reps).length;
  const lrn=questions.filter(q=>q.sr?.reps>0&&(q.sr?.interval||0)<7).length;
  const rev=questions.filter(q=>(q.sr?.interval||0)>=7&&(q.sr?.interval||0)<21).length;
  const mat=matureCount(), tot=questions.length||1;
  document.getElementById('dist').innerHTML=[
    {label:'新規',count:newC,c:'bl'},{label:'学習中',count:lrn,c:'am'},
    {label:'復習',count:rev,c:'gr'},{label:'習熟済み',count:mat,c:'ac'}
  ].map(d=>`<div class="di"><span class="dl">${d.label}</span><div class="dbw"><div class="db pf ${d.c}" style="width:${Math.round(d.count/tot*100)}%"></div></div><span class="dc">${d.count}</span></div>`).join('');
  const cs=cats();
  document.getElementById('cat-mas').innerHTML=!cs.length?'<div class="empty">データなし</div>':cs.map(c=>{
    const qs=questions.filter(q=>q.cat===c);
    const a=qs.reduce((s,q)=>s+(q.attempts||0),0), r=qs.reduce((s,q)=>s+(q.correct||0),0);
    const pct=a>0?Math.round(r/a*100):0, mat=qs.filter(q=>(q.sr?.interval||0)>=21).length;
    const bc=pct>=70?'gr':pct>=50?'am':'rd';
    return `<div style="padding:10px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:500">${c}</span><span style="font-size:12px;font-family:var(--mono);color:var(--text2)">${pct}% 習熟:${mat}/${qs.length}</span></div><div class="pb"><div class="pf ${bc}" style="width:${pct}%"></div></div></div>`;
  }).join('');
}

function switchTab(n) {
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active');
  document.getElementById('s-'+n).classList.add('active');
  if(n==='home')updateHome();
  if(n==='manage')renderManage();
  if(n==='stats')updateStats();
  if(n==='quiz')updateDueBanner();
}

async function addQ() {
  const cat=document.getElementById('a-cat').value.trim(), q=document.getElementById('a-q').value.trim();
  const ch={a:document.getElementById('a-a').value.trim(),b:document.getElementById('a-b').value.trim(),c:document.getElementById('a-c').value.trim(),d:document.getElementById('a-d').value.trim(),e:document.getElementById('a-e').value.trim()};
  const ans=[...document.querySelectorAll('#achk input:checked')].map(i=>i.value);
  const memo=document.getElementById('a-mem').value.trim(), yr=document.getElementById('a-yr').value.trim();
  if(!cat||!q||!ch.a||!ans.length){toast('カテゴリー・問題文・選択肢a・正解は必須','error');return;}
  questions.push({id:Date.now(),cat,year:yr,q,choices:ch,answers:ans,memo,attempts:0,correct:0,sr:null});
  await save(); updateAll();
  ['a-q','a-a','a-b','a-c','a-d','a-e','a-mem','a-yr'].forEach(id=>document.getElementById(id).value='');
  document.querySelectorAll('#achk input').forEach(i=>i.checked=false);
  document.querySelectorAll('#achk .cl').forEach(l=>l.classList.remove('on'));
  toast('登録しました！','success');
}

function renderManage() {
  const f=document.getElementById('f-cat')?.value||'all';
  const qs=f==='all'?questions:questions.filter(q=>q.cat===f);
  const el=document.getElementById('qlist');
  if(!qs.length){el.innerHTML='<div class="empty">問題がありません</div>';return;}
  el.innerHTML=qs.map(q=>{
    const pct=(q.attempts||0)>0?Math.round((q.correct||0)/(q.attempts||0)*100):null;
    const bc=pct===null?'bgray':pct>=70?'bgr':pct>=50?'bam':'brd';
    const iv=q.sr?.interval;
    return `<div class="qi"><div class="qim">
      <div class="qimt">
        <span class="badge bac">${q.cat}</span>
        ${q.year?`<span style="font-size:11px;color:var(--text3);font-family:var(--mono)">${q.year}</span>`:''}
        <span class="badge ${bc}">${pct!==null?pct+'%':'未挑戦'}</span>
        ${iv?`<span class="badge bgray" style="font-size:10px">${iv}日間隔</span>`:''}
        ${isDue(q)?`<span class="badge bac" style="font-size:10px">期限</span>`:''}
      </div>
      <div class="qitx">${q.q.length>70?q.q.slice(0,70)+'…':q.q}</div>
    </div>
    <button class="btn gh sm" style="padding:6px;color:var(--text3);flex-shrink:0" onclick="delQ(${q.id})">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
    </button></div>`;
  }).join('');
}

async function delQ(id){if(!confirm('削除しますか？'))return;questions=questions.filter(q=>q.id!==id);await save();updateAll();toast('削除しました');}
async function resetAll(){if(!confirm('全データをリセットしますか？'))return;questions.forEach(q=>{q.attempts=0;q.correct=0;q.sr=null;});activity={};await save();updateAll();toast('リセットしました');}

let sess={queue:[],idx:0,correct:0,answered:false};

function startReview(){
  const pool=questions.filter(isDue);
  if(!pool.length){toast('期限切れの問題がありません','error');return;}
  sess={queue:pool,idx:0,correct:0,answered:false};
  document.getElementById('q-setup').style.display='none';
  document.getElementById('q-res').style.display='none';
  document.getElementById('q-main').style.display='block';
  showQ();
}

function startQuiz(){
  const cat=document.getElementById('qz-cat').value, mode=document.getElementById('qz-mode').value;
  let pool=cat==='all'?[...questions]:questions.filter(q=>q.cat===cat);
  if(mode==='due')pool=pool.filter(isDue);
  else if(mode==='weak')pool.sort((a,b)=>{const ra=(a.attempts||0)>0?(a.correct||0)/(a.attempts||0):-1,rb=(b.attempts||0)>0?(b.correct||0)/(b.attempts||0):-1;return ra-rb;});
  else if(mode==='new')pool=pool.filter(q=>!q.sr?.reps);
  else pool.sort(()=>Math.random()-0.5);
  if(!pool.length){toast('この条件で問題がありません','error');return;}
  sess={queue:pool,idx:0,correct:0,answered:false};
  document.getElementById('q-setup').style.display='none';
  document.getElementById('q-res').style.display='none';
  document.getElementById('q-main').style.display='block';
  showQ();
}

function showQ(){
  const q=sess.queue[sess.idx], tot=sess.queue.length;
  sess.answered=false;
  document.getElementById('q-prog').textContent=`${sess.idx+1} / ${tot}`;
  document.getElementById('q-bar').style.width=Math.round(sess.idx/tot*100)+'%';
  document.getElementById('q-cb').textContent=q.cat;
  document.getElementById('q-yr').textContent=q.year||'';
  document.getElementById('q-fb').style.display='none';
  document.getElementById('rbtns').style.display='none';
  const ib=document.getElementById('q-ivb');
  if(q.sr?.interval){ib.style.display='inline-block';ib.textContent=`間隔: ${q.sr.interval}日`;}else ib.style.display='none';
  document.getElementById('q-tx').textContent=q.q;
  const ls=['a','b','c','d','e'];
  document.getElementById('q-ch').innerHTML=ls.filter(l=>q.choices[l]).map(l=>`<button class="ch" onclick="pick('${l}')"><span class="chl">${l}</span><span>${q.choices[l]}</span></button>`).join('');
}

async function pick(p){
  if(sess.answered)return;
  sess.answered=true;
  const q=sess.queue[sess.idx], isC=q.answers.includes(p);
  document.querySelectorAll('.ch').forEach(b=>b.disabled=true);
  document.querySelectorAll('.ch').forEach(b=>{
    const l=b.querySelector('.chl').textContent;
    if(q.answers.includes(l))b.classList.add('cor');
    else if(l===p)b.classList.add('wrg');
  });
  const fb=document.getElementById('q-fb');
  fb.style.display='block';
  fb.className='fb '+(isC?'cor':'wrg');
  fb.innerHTML=isC?`<strong>正解！</strong>${q.memo?`<div class="memo">${q.memo}</div>`:''}`:`<strong>不正解。正解は ${q.answers.join('・')}）</strong>${q.memo?`<div class="memo">${q.memo}</div>`:''}`;
  if(isC)sess.correct++;
  const qi=questions.findIndex(x=>x.id===q.id);
  if(qi>=0){questions[qi].attempts=(questions[qi].attempts||0)+1;if(isC)questions[qi].correct=(questions[qi].correct||0)+1;}
  const td=today();activity[td]=(activity[td]||0)+1;
  const rb=document.getElementById('rbtns');rb.style.display='grid';
  [0,1,2,3].forEach(r=>document.getElementById('ri'+r).textContent=itText(q,r));
  await save();
}

async function rate(r){
  const q=sess.queue[sess.idx], qi=questions.findIndex(x=>x.id===q.id);
  if(qi>=0)questions[qi].sr=sm2(questions[qi],r);
  await save();
  sess.idx++;
  if(sess.idx>=sess.queue.length){showResult();return;}
  showQ();
}

function showResult(){
  document.getElementById('q-main').style.display='none';
  document.getElementById('q-res').style.display='block';
  const tot=sess.queue.length, pct=Math.round(sess.correct/tot*100);
  document.getElementById('r-pct').textContent=pct+'%';
  document.getElementById('r-em').textContent=pct>=80?'👏':pct>=60?'💪':'📚';
  document.getElementById('r-msg').textContent=pct>=80?'素晴らしい！':pct>=60?'いい調子！':'もう一度復習しよう';
  document.getElementById('r-dt').textContent=`${tot}問中 ${sess.correct}問正解`;
  updateHome();
}

function showSetup(){
  document.getElementById('q-res').style.display='none';
  document.getElementById('q-main').style.display='none';
  document.getElementById('q-setup').style.display='block';
  updateDueBanner();
}

function endQuiz(){if(!confirm('終了しますか？'))return;showSetup();}

function toast(msg,type=''){
  const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');setTimeout(()=>t.className='toast',2200);
}

document.querySelectorAll('#achk input').forEach(inp=>inp.addEventListener('change',function(){this.closest('.cl').classList.toggle('on',this.checked);}));

load();
</script>
</body>
</html>
